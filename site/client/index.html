<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet" />
<title>Shree Bajaj Motors, Umerkote</title>
</head>
<body>
<div id="root"></div>
<!-- Netlify's build bot only scans static HTML, so it can never see the React
     form. This hidden twin registers the "booking" form and its fields; the
     React form posts to it at runtime. Field names must stay in sync with
     src/pages/Booking.jsx. -->
<form name="booking" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
  <input type="text" name="name" />
  <input type="tel" name="phone" />
  <input type="text" name="model" />
  <input type="text" name="bot-field" />
</form>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
